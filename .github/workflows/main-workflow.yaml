name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # We map the IONOS server secret to an environment variable so we can check if it exists
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifact (Zip fallback for WebSpace Explorer)
        uses: actions/upload-artifact@v4
        with:
          name: martin-motors-website
          path: ./dist/

      - name: Deploy to IONOS via FTP
        # This step will ONLY run if you have added the FTP_SERVER secret to GitHub.
        # If it's missing, it neatly skips this step instead of failing the workflow!
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
